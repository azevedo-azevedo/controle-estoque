<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Dose</title>
  <script>
    // Aplica o tema (claro/escuro) recebido do index.html antes do CSS
    // carregar, para não haver flash do tema errado.
    (function () {
      var t = new URLSearchParams(location.search).get("theme");
      if (t === "light" || t === "dark") {
        document.documentElement.setAttribute("data-theme", t);
      }
    })();
  </script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
  <link rel="stylesheet" href="theme.css">
  <script src="theme.js" defer></script>
</head>
<body class="calc-page-body">

  <div class="calc-wrap">
    <div class="calc-card">
      <div class="calc-card-title">
        <i class="ti ti-droplet" style="color:#185FA5;" aria-hidden="true"></i>
        <h3>Calculadora de dose</h3>
      </div>
      <p class="calc-card-desc">Calcule a dose diária total administrada pelo paciente.</p>

      <p class="calc-section-label">Medicamento</p>
      <div class="calc-field-group">
        <div class="calc-field">
          <label for="marca">Marca</label>
          <select id="marca">
            <option value="40">Akras (40 gotas/ml)</option>
            <option value="35">Biocase (35 gotas/ml)</option>
            <option value="40">Bontà Botanicals (40 gotas/ml)</option>
            <option value="44">Canna River (44 gotas/ml)</option>
            <option value="38">cbdMD (38 gotas/ml)</option>
            <option value="47">CBfarma (47 gotas/ml)</option>
            <option value="30">Ease Labs (30 gotas/ml)</option>
            <option value="43">Eliv (43 gotas/ml)</option>
            <option value="36">Entourage (36 gotas/ml)</option>
            <option value="40">Erth Wellness (40 gotas/ml)</option>
            <option value="42">Evona (42 gotas/ml)</option>
            <option value="30">Extractos del Sur (30 gotas/ml)</option>
            <option value="30">FoliuMed (30 gotas/ml)</option>
            <option value="35">Full Spectrum Biologics (35 gotas/ml)</option>
            <option value="28">Greens JAN-D 1500 (28 gotas/ml)</option>
            <option value="28">Greens JAN-D 5100 (28 gotas/ml)</option>
            <option value="32">Greens G-LIFE 6000 (32 gotas/ml)</option>
            <option value="45">HempMeds RSHO BR 3000 (45 gotas/ml)</option>
            <option value="50">HempMeds RSHO BR 6000 (50 gotas/ml)</option>
            <option value="50">HempMeds RSHO Calm Support (50 gotas/ml)</option>
            <option value="35">HempMeds RSHO Focus Support (35 gotas/ml)</option>
            <option value="50">HempMeds RSHO X 6000 (50 gotas/ml)</option>
            <option value="33">HempMeds 9 1:1 (33 gotas/ml)</option>
            <option value="49">Korasana (49 gotas/ml)</option>
            <option value="35">Lazarus Naturals (35 gotas/ml)</option>
            <option value="40">Luna Organics Relief (40 gotas/ml)</option>
            <option value="48">Luna Organics Sleep (48 gotas/ml)</option>
            <option value="41">Moonlion (41 gotas/ml)</option>
            <option value="48">Naternal (48 gotas/ml)</option>
            <option value="52">Natyva (52 gotas/ml)</option>
            <option value="42">Neurogan (42 gotas/ml)</option>
            <option value="40">Nex Biopharma (40 gotas/ml)</option>
            <option value="40">Odonto CBD (40 gotas/ml)</option>
            <option value="50">Okii (50 gotas/ml)</option>
            <option value="45">Pure Jamaican (45 gotas/ml)</option>
            <option value="40">Remederi (40 gotas/ml)</option>
            <option value="33">Sensia 1:1 CBD/THC e THC (33 gotas/ml)</option>
            <option value="45">Sensia (45 gotas/ml)</option>
            <option value="56">Serene (56 gotas/ml)</option>
            <option value="33">SereneCBD (33 gotas/ml)</option>
            <option value="46">Swiss Vitalis (46 gotas/ml)</option>
            <option value="35">UB Super (35 gotas/ml)</option>
            <option value="30">USA Hemp (30 gotas/ml)</option>
            <option value="34">Valtellinamed (34 gotas/ml)</option>
            <option value="30">Volcanic (30 gotas/ml)</option>
            <option value="37">Zion (37 gotas/ml)</option>
          </select>
        </div>
        <div class="calc-field-row">
          <div class="calc-field">
            <label for="unidade">Unidade de dosagem</label>
            <select id="unidade" onchange="atualizarPlaceholder()">
              <option value="gotas">Gotas</option>
              <option value="ml">mL</option>
              <option value="mg">mg</option>
            </select>
          </div>
          <div class="calc-field">
            <label for="volume">Volume do frasco</label>
            <select id="volume">
              <option value="10">10 mL</option>
              <option value="15">15 mL</option>
              <option value="30">30 mL</option>
              <option value="60">60 mL</option>
              <option value="120">120 mL</option>
            </select>
          </div>
        </div>
      </div>

      <p class="calc-section-label">Administração</p>
      <div class="calc-field-group">
        <div class="calc-field">
          <label for="miligramagem">Concentração do medicamento</label>
          <div class="unit-suffix">
            <input type="number" id="miligramagem" placeholder="Ex: 300" min="1">
            <span>mg/frasco</span>
          </div>
        </div>
        <div class="calc-field">
          <label for="dosagem">Dosagem diária</label>
          <div class="unit-suffix">
            <input type="number" id="dosagem" placeholder="Ex: 15" min="0.01" step="0.01">
            <span id="dosagemUnidadeLabel">gotas/dia</span>
          </div>
        </div>
      </div>

      <div class="calc-buttons">
        <button class="btn-primary" onclick="calcularMgDia()">Calcular dose</button>
        <button class="btn-secondary" onclick="limparCampos()">Limpar</button>
      </div>

      <div class="calc-result" id="resultBlock" hidden>
        <div class="calc-result-hero" id="heroBox">
          <p class="label" id="heroLabel">Dose diária total</p>
          <p class="value" id="heroValue">—</p>
        </div>

        <div class="calc-result-grid" id="statsGrid">
          <div class="calc-stat">
            <p class="label" id="stat1Label"><i class="ti ti-droplet" aria-hidden="true"></i>Equivalente em mL</p>
            <p class="value" id="stat1Value">—</p>
          </div>
          <div class="calc-stat">
            <p class="label" id="stat2Label"><i class="ti ti-flask" aria-hidden="true"></i>Equivalente em gotas</p>
            <p class="value" id="stat2Value">—</p>
          </div>
        </div>

        <div class="calc-result-actions">
          <button class="btn-ghost" onclick="copiarResultado()"><i class="ti ti-copy" aria-hidden="true"></i>Copiar resultado</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    let ultimoResultadoTexto = "";

    function atualizarPlaceholder() {
      const unidade = document.getElementById("unidade").value;
      document.getElementById("dosagem").placeholder =
        unidade === "gotas" ? "Ex: 15" :
        unidade === "ml" ? "Ex: 0,5" :
        "Ex: 10";
      document.getElementById("dosagemUnidadeLabel").textContent =
        unidade === "gotas" ? "gotas/dia" :
        unidade === "ml" ? "mL/dia" :
        "mg/dia";
    }

    function mostrarErro(msg) {
      const resultBlock = document.getElementById("resultBlock");
      const heroBox = document.getElementById("heroBox");
      const statsGrid = document.getElementById("statsGrid");
      const actions = document.querySelector(".calc-result-actions");

      resultBlock.hidden = false;
      heroBox.classList.add("error");
      document.getElementById("heroLabel").textContent = "";
      document.getElementById("heroValue").textContent = msg;
      statsGrid.style.display = "none";
      actions.style.display = "none";
    }

    function calcularMgDia() {
      const marca = parseFloat(document.getElementById("marca").value);
      const unidade = document.getElementById("unidade").value;
      const volume = parseFloat(document.getElementById("volume").value);
      const miligramagem = parseFloat(document.getElementById("miligramagem").value);
      const dosagem = parseFloat(document.getElementById("dosagem").value);

      if (isNaN(dosagem) || dosagem <= 0 || isNaN(miligramagem) || miligramagem <= 0) {
        mostrarErro("Insira valores válidos.");
        return;
      }

      let gotasDia, mlDia, mgDia;
      if (unidade === "gotas") {
        gotasDia = dosagem;
        mlDia = dosagem / marca;
        mgDia = (mlDia * miligramagem) / volume;
      } else if (unidade === "ml") {
        mlDia = dosagem;
        gotasDia = dosagem * marca;
        mgDia = (dosagem * miligramagem) / volume;
      } else {
        mgDia = dosagem;
        const mgPorMl = miligramagem / volume;
        mlDia = dosagem / mgPorMl;
        gotasDia = mlDia * marca;
      }

      const resultBlock = document.getElementById("resultBlock");
      const heroBox = document.getElementById("heroBox");
      const statsGrid = document.getElementById("statsGrid");
      const actions = document.querySelector(".calc-result-actions");

      resultBlock.hidden = false;
      heroBox.classList.remove("error");
      statsGrid.style.display = "";
      actions.style.display = "";

      if (unidade === "mg") {
        document.getElementById("heroLabel").textContent = "Gotas necessárias por dia";
        document.getElementById("heroValue").textContent = gotasDia.toFixed(0) + " gotas";
        document.getElementById("stat1Label").innerHTML = '<i class="ti ti-droplet" aria-hidden="true"></i>Equivalente em mL';
        document.getElementById("stat1Value").textContent = mlDia.toFixed(2) + " mL";
        document.getElementById("stat2Label").innerHTML = '<i class="ti ti-pill" aria-hidden="true"></i>Dose administrada';
        document.getElementById("stat2Value").textContent = mgDia.toFixed(2) + " mg/dia";
        ultimoResultadoTexto = `Dose: ${gotasDia.toFixed(0)} gotas/dia (${mlDia.toFixed(2)} mL) para administrar ${mgDia.toFixed(2)} mg/dia`;
      } else {
        document.getElementById("heroLabel").textContent = "Dose diária total";
        document.getElementById("heroValue").textContent = mgDia.toFixed(2) + " mg/dia";
        document.getElementById("stat1Label").innerHTML = '<i class="ti ti-droplet" aria-hidden="true"></i>Equivalente em mL';
        document.getElementById("stat1Value").textContent = mlDia.toFixed(2) + " mL";
        document.getElementById("stat2Label").innerHTML = '<i class="ti ti-flask" aria-hidden="true"></i>Equivalente em gotas';
        document.getElementById("stat2Value").textContent = gotasDia.toFixed(0) + " gotas";
        ultimoResultadoTexto = `Dose diária total: ${mgDia.toFixed(2)} mg/dia (${gotasDia.toFixed(0)} gotas · ${mlDia.toFixed(2)} mL)`;
      }
    }

    function limparCampos() {
      document.getElementById("marca").selectedIndex = 0;
      document.getElementById("unidade").selectedIndex = 0;
      document.getElementById("volume").selectedIndex = 0;
      document.getElementById("miligramagem").value = "";
      document.getElementById("dosagem").value = "";
      document.getElementById("resultBlock").hidden = true;
      atualizarPlaceholder();
    }

    function copiarResultado() {
      const label = document.getElementById("heroLabel").textContent.trim();
      const value = document.getElementById("heroValue").textContent.trim();
      if (!value || value === "—") return;
      const texto = `${label} ${value}`.trim();
      if (navigator.clipboard) {
        navigator.clipboard.writeText(texto);
      }
    }

    document.addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        event.preventDefault();
        calcularMgDia();
        document.activeElement.blur();
      }
    });
  </script>
</body>
</html>
